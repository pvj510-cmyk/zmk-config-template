on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          pip install west
          west init -l config
          west update

      - name: Build Left
        run: west build -s zmk/app -b nice_nano_v2 -- -DSHIELD="felix_left"

      - name: Build Right
        run: west build -s zmk/app -b nice_nano_v2 -- -DSHIELD="felix_right"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/zephyr/*.uf2
